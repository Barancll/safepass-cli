{% load static %}
<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    {% if SP_USER %}<meta name="sp-authenticated" content="1">
    <meta name="sp-username" content="{{ SP_USER.username }}">
    <meta name="sp-clipboard-clear" content="{{ SP_USER.clipboard_clear_seconds }}">
    <meta name="sp-has-recovery-key" content="{{ SP_HAS_RECOVERY_KEY|yesno:'1,0' }}">
    {% if SP_SHOW_WHATS_NEW %}<meta name="sp-whats-new" content="1">{% endif %}{% endif %}
    <title data-i18n-page="{% block title_key %}{% endblock %}">{% block title %}SafePass - Şifre Yöneticisi{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="96x96" href="{% static 'images/favicon-96x96.png' %}">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v={{ APP_VERSION }}-act1">
    {% block extra_css %}{% endblock %}
    <!-- Theme and appearance first, so the page never paints with the wrong look -->
    <script src="{% static 'js/modules/theme.js' %}?v={{ APP_VERSION }}-act1"></script>
    <script src="{% static 'js/modules/appearance.js' %}?v={{ APP_VERSION }}-act1"></script>
</head>

<body class="{% block body_class %}{% endblock %}">

    {% block content %}{% endblock %}

    <!-- Scripts -->
    <script src="{% static 'js/modules/i18n.js' %}?v={{ APP_VERSION }}-sim2"></script>
    <script src="{% static 'js/app.js' %}?v={{ APP_VERSION }}-act2"></script>
    {% if SP_USER %}<script src="{% static 'js/modules/vault_fields.js' %}?v={{ APP_VERSION }}-act1"></script>
    <script src="{% static 'js/modules/notifications.js' %}?v={{ APP_VERSION }}-act1"></script>
    <script src="{% static 'js/modules/tour.js' %}?v={{ APP_VERSION }}-sim1"></script>
    <script src="{% static 'js/modules/about.js' %}?v={{ APP_VERSION }}-act1"></script>{% endif %}
    {% block extra_js %}{% endblock %}
</body>

</html>
