<div class="auth-page-controls">
    <button type="button" class="auth-theme-toggle" id="authThemeToggle"
        data-i18n-title="settings.theme" data-i18n-aria-label="settings.theme"
        title="Tema" aria-label="Tema">
        <svg class="auth-theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
        </svg>
        <svg class="auth-theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8 8.5 8.5 0 1 0 20.2 15.4Z"></path>
        </svg>
    </button>
    <div class="auth-language-toggle">
        <button type="button" class="auth-language-trigger" aria-haspopup="listbox" aria-expanded="false"
            aria-controls="auth-language-menu">
            <svg class="auth-language-flag auth-flag-tr" aria-hidden="true" viewBox="0 0 24 16">
                <rect width="24" height="16" rx="2" fill="#e30a17"/>
                <circle cx="10" cy="8" r="4.2" fill="#fff"/>
                <circle cx="11.2" cy="8" r="3.35" fill="#e30a17"/>
                <path d="m15.3 5.3.65 1.8 1.9.05-1.5 1.15.55 1.85-1.6-1.08-1.58 1.08.52-1.85-1.48-1.15 1.9-.05z" fill="#fff"/>
            </svg>
            <svg class="auth-language-flag auth-flag-en" aria-hidden="true" viewBox="0 0 24 16">
                <rect width="24" height="16" rx="2" fill="#1b3f8b"/>
                <path d="m0 0 24 16M24 0 0 16" stroke="#fff" stroke-width="4"/>
                <path d="m0 0 24 16M24 0 0 16" stroke="#c8102e" stroke-width="1.5"/>
                <path d="M12 0v16M0 8h24" stroke="#fff" stroke-width="6"/>
                <path d="M12 0v16M0 8h24" stroke="#c8102e" stroke-width="2.5"/>
                <rect width="24" height="16" rx="2" fill="none" stroke="rgba(255,255,255,.18)"/>
            </svg>
            <svg class="auth-language-flag auth-flag-es" aria-hidden="true" viewBox="0 0 24 16">
                <rect width="24" height="16" rx="2" fill="#aa151b"/>
                <rect y="4" width="24" height="8" fill="#f1bf00"/>
            </svg>
            <svg class="auth-language-flag auth-flag-de" aria-hidden="true" viewBox="0 0 24 16">
                <rect width="24" height="16" rx="2" fill="#000"/>
                <rect y="5.33" width="24" height="5.34" fill="#dd0000"/>
                <path d="M0 10.67h24V14a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2z" fill="#ffce00"/>
            </svg>
            <svg class="auth-language-flag auth-flag-ru" aria-hidden="true" viewBox="0 0 24 16">
                <rect width="24" height="16" rx="2" fill="#fff"/>
                <rect y="5.33" width="24" height="5.34" fill="#0039a6"/>
                <path d="M0 10.67h24V14a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2z" fill="#d52b1e"/>
            </svg>
            <span data-auth-current-language>TR</span>
            <span class="auth-language-chevron" aria-hidden="true"></span>
        </button>
        <div class="auth-language-menu" id="auth-language-menu" role="listbox" aria-label="Language" hidden>
            <button type="button" role="option" data-lang-option="tr" aria-selected="true" aria-label="Türkçe" title="Türkçe">
                <svg class="auth-language-flag" aria-hidden="true" viewBox="0 0 24 16">
                    <rect width="24" height="16" rx="2" fill="#e30a17"/>
                    <circle cx="10" cy="8" r="4.2" fill="#fff"/>
                    <circle cx="11.2" cy="8" r="3.35" fill="#e30a17"/>
                    <path d="m15.3 5.3.65 1.8 1.9.05-1.5 1.15.55 1.85-1.6-1.08-1.58 1.08.52-1.85-1.48-1.15 1.9-.05z" fill="#fff"/>
                </svg>
                <span>TR</span>
            </button>
            <button type="button" role="option" data-lang-option="en" aria-selected="false" aria-label="English" title="English">
                <svg class="auth-language-flag" aria-hidden="true" viewBox="0 0 24 16">
                    <rect width="24" height="16" rx="2" fill="#1b3f8b"/>
                    <path d="m0 0 24 16M24 0 0 16" stroke="#fff" stroke-width="4"/>
                    <path d="m0 0 24 16M24 0 0 16" stroke="#c8102e" stroke-width="1.5"/>
                    <path d="M12 0v16M0 8h24" stroke="#fff" stroke-width="6"/>
                    <path d="M12 0v16M0 8h24" stroke="#c8102e" stroke-width="2.5"/>
                    <rect width="24" height="16" rx="2" fill="none" stroke="rgba(255,255,255,.18)"/>
                </svg>
                <span>EN</span>
            </button>
            <button type="button" role="option" data-lang-option="es" aria-selected="false" aria-label="Español" title="Español">
                <svg class="auth-language-flag" aria-hidden="true" viewBox="0 0 24 16">
                    <rect width="24" height="16" rx="2" fill="#aa151b"/>
                    <rect y="4" width="24" height="8" fill="#f1bf00"/>
                </svg>
                <span>ES</span>
            </button>
            <button type="button" role="option" data-lang-option="de" aria-selected="false" aria-label="Deutsch" title="Deutsch">
                <svg class="auth-language-flag" aria-hidden="true" viewBox="0 0 24 16">
                    <rect width="24" height="16" rx="2" fill="#000"/>
                    <rect y="5.33" width="24" height="5.34" fill="#dd0000"/>
                    <path d="M0 10.67h24V14a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2z" fill="#ffce00"/>
                </svg>
                <span>DE</span>
            </button>
            <button type="button" role="option" data-lang-option="ru" aria-selected="false" aria-label="Русский" title="Русский">
                <svg class="auth-language-flag" aria-hidden="true" viewBox="0 0 24 16">
                    <rect width="24" height="16" rx="2" fill="#fff"/>
                    <rect y="5.33" width="24" height="5.34" fill="#0039a6"/>
                    <path d="M0 10.67h24V14a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2z" fill="#d52b1e"/>
                </svg>
                <span>RU</span>
            </button>
        </div>
    </div>
</div>
